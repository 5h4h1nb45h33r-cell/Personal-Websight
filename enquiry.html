<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Thittayil Shahin Basheer</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 40px auto;
            background: #121826;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 183, 3, 0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ffb703;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333333;
            background-color: #1a2234;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ffb703;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #ffb703;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #e0a000;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffb703;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Home</a>

    <div class="form-container">
        <h2>Project Enquiry Form</h2>
        
        <!-- Formspree Endpoint URL ഇവിടെ ചേർക്കുക -->
        <form action="https://formspree.io/f/mpqvgrky" method="POST">
            
            <div class="form-group">
                <label>Your Name:</label>
                <input type="text" name="Name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Phone Number:</label>
                <input type="tel" name="Phone" required placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" name="Email" placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label>Service Required:</label>
                <select name="Service_Type" required>
                    <option value="" disabled selected>Select a Service</option>
                    <option value="New Building Construction">New Building Construction</option>
                    <option value="Building Renovation">Building Renovation</option>
                    <option value="Architecture Planning / Planing">Architecture Planning</option>
                    <option value="Other Enquiries">Other Enquiries</option>
                </select>
            </div>

            <div class="form-group">
                <label>Project Details / Message:</label>
                <textarea name="Message" rows="5" placeholder="Location, Area in sqft, or any specific requirements..."></textarea>
            </div>

            <button type="submit">Submit Enquiry</button>
        </form>
    </div>

</body>
